<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude fleet</title>
<link id="fav" rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1f1f1d; --dim: #77756f;
    --line: #e4e1da; --orange: #cb6a44; --orange-bg: #fbeee8;
    --green: #2f9e5f; --green-bg: #e9f6ee; --blue: #3b6fb6; --yellow: #b8860b;
    --red: #c2413a; --chip: #f0eee9; --focus: #1f1f1d;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* project hues: muted, none of them a lane colour (lane colour owns
       the slot square, the borders and the state line) */
    --p0: #3f8f88; --p1: #8a5b9e; --p2: #9a6a52; --p3: #6a7a9c;
    --p4: #7f8a4a; --p5: #a05c7a; --p6: #5c8a9e; --p7: #8c7a4a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517; --panel: #1d1f22; --text: #e8e6e1; --dim: #8d8a84;
      --line: #2c2e32; --orange: #e0835d; --orange-bg: #33231c;
      --green: #4cc47e; --green-bg: #18291f; --blue: #79a6e6; --yellow: #e0b54a;
      --red: #ef6f66; --chip: #2a2c30; --focus: #e8e6e1;
      --p0: #5fb3ab; --p1: #b088c4; --p2: #c4907a; --p3: #93a3c7;
      --p4: #a6b26e; --p5: #c784a2; --p6: #82b1c7; --p7: #b5a16b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
               Ubuntu, sans-serif; }
  button { font: inherit; }
  button:focus-visible, .pchip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  header { display: flex; align-items: baseline; gap: 14px;
           padding: 14px 20px 4px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sum { color: var(--dim); }
  header .sum b { color: var(--orange); }
  #offline { display: none; margin: 0 20px 8px; padding: 8px 12px;
             border-radius: 8px; background: var(--chip); color: var(--dim); }
  body.off #offline { display: block; }
  body.off main { opacity: .45; }

  /* ---- filter bar ---- */
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
         padding: 4px 20px 6px; }
  .bar .lbl { color: var(--dim); font-size: 12px; text-transform: uppercase;
              letter-spacing: .06em; font-weight: 600; margin-right: 2px; }
  .pchip { display: inline-flex; align-items: center; gap: 7px;
           background: var(--panel); border: 1px solid var(--line);
           border-radius: 999px; padding: 3px 11px 3px 8px; cursor: pointer;
           color: var(--text); user-select: none; }
  .pchip .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .pchip .n { color: var(--dim); font-size: 12px; }
  .pchip.on { border-color: var(--text); background: var(--chip); }
  .pchip.tag { border-style: dashed; }
  .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .guard { display: inline-flex; align-items: center; gap: 6px;
           border-radius: 999px; padding: 3px 11px; cursor: pointer;
           background: var(--orange); color: #fff; border: 0; font-weight: 600;
           animation: breathe 2.2s ease-in-out infinite; }
  .guard.review { background: var(--green); animation: none; }
  .show { margin-left: auto; display: flex; gap: 10px; align-items: center;
          color: var(--dim); font-size: 12px; }
  .show label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }

  main { padding: 4px 20px 30px; }
  /* wide screens: lanes side by side (kanban); empty and collapsed lanes
     shrink to a header so the live ones get the room. Narrow: stacked. */
  @media (min-width: 1000px) {
    main { display: flex; flex-wrap: wrap; gap: 14px;
           align-items: flex-start; }
    body.drawer main { padding-right: 452px; }
    .lane { flex: 1 1 0; min-width: 260px; margin-top: 6px; }
    .lane.empty, .lane.collapsed { flex: 0 0 auto; min-width: 0;
                                   width: auto; padding-right: 8px; }
    .lane.empty > h2, .lane.collapsed > h2 { white-space: nowrap; }
    .lane .cards { grid-template-columns: 1fr; }
    #drawer { display: none; position: fixed; top: 0; right: 0; bottom: 0;
              width: 432px; background: var(--panel); border-left: 1px solid var(--line);
              overflow-y: auto; padding: 14px 16px 30px; z-index: 6; }
    body.drawer #drawer { display: block; }
    .card.open .row { -webkit-line-clamp: 2; }   /* expand lives in the drawer */
  }
  @media (max-width: 999px) {
    #drawer { display: none; }
    .card.open .row { -webkit-line-clamp: unset; }
  }
  .lane { margin: 10px 0 4px; }
  .lane > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
               color: var(--dim); margin: 0 0 6px; font-weight: 600;
               cursor: pointer; user-select: none; display: flex;
               align-items: center; gap: 4px; }
  .lane > h2 .n { font-weight: 400; }
  .lane > h2 .allseen { margin-left: auto; font-size: 11px; text-transform: none;
                        letter-spacing: 0; background: none; border: 0;
                        color: var(--green); cursor: pointer; padding: 0; }
  .lane.empty > h2 { opacity: .5; }
  .lane.collapsed .cards { display: none; }
  .lane.collapsed > h2::after { content: " ▸"; }
  .lane[data-lane="needs"] > h2 { color: var(--orange); }
  .cards { display: grid; gap: 10px;
           grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 10px 12px; min-width: 0;
          position: relative; cursor: pointer; }
  .card.needs { border-color: var(--orange); background: var(--orange-bg);
                animation: breathe 2.2s ease-in-out infinite; }
  .card.needs.long { animation-duration: 1.2s; }
  .card.needs.snoozed { animation: none; border-color: var(--line);
                        background: var(--panel); opacity: .8; }
  .card.review { border-left: 4px solid var(--green); }
  .card.parked, .card.done { opacity: .82; }
  .card.sel { box-shadow: 0 0 0 2px var(--focus); }
  .card.linked { box-shadow: 0 0 0 2px var(--dim); }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 transparent; }
    50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--orange) 35%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) { .card.needs, .guard { animation: none; } }
  .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .slot { flex: none; width: 22px; height: 22px; border-radius: 6px;
          display: grid; place-items: center; font-weight: 700; font-size: 12px;
          background: var(--chip); color: var(--dim); }
  .needs:not(.snoozed) .slot { background: var(--orange); color: #fff; }
  .review .slot { background: var(--green); color: #fff; }
  .slot.needs { background: var(--orange); color: #fff; }
  .slot.review { background: var(--green); color: #fff; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden;
           text-overflow: ellipsis; flex: 1 1 auto; min-width: 70px; }
  .meta { margin-left: auto; flex: 0 1 auto; color: var(--dim); font-size: 12px;
          display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
          overflow: hidden; }
  .meta .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .meta .pj { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .meta .br { font-family: var(--mono); font-size: 11px; max-width: 120px;
              overflow: hidden; text-overflow: ellipsis; }
  .note { margin-top: 3px; font-size: 12px; color: var(--dim); font-style: italic;
          overflow-wrap: anywhere; }
  .note .tag { font-style: normal; color: var(--text); background: var(--chip);
               border-radius: 4px; padding: 0 5px; }
  .state { margin: 6px 0 2px; font-weight: 600; font-size: 13px; }
  .state.needs { color: var(--orange); }
  .snoozed .state.needs { color: var(--dim); }
  .state.limited { color: var(--yellow); }
  .state.review { color: var(--green); }
  .state.running { color: var(--blue); }
  .state.done, .state.parked { color: var(--dim); }
  .row { margin-top: 5px; font-size: 13px; color: var(--text);
         display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
         -webkit-line-clamp: 2; overflow-wrap: anywhere; }
  .row.reply { display: block; -webkit-line-clamp: unset; }
  .row .who { color: var(--dim); font-weight: 600; margin-right: 4px; }
  .row .prog { color: var(--dim); margin-left: 4px; }
  pre.perm { margin: 6px 0 0; padding: 6px 8px; background: var(--chip);
             border-radius: 6px; font: 12px/1.4 var(--mono); white-space: pre-wrap;
             overflow-wrap: anywhere; max-height: 4.4em; overflow: hidden; }
  #drawer pre.perm { max-height: none; }
  .opts { margin-top: 5px; font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; }
  .opts span { background: var(--chip); border-radius: 6px; padding: 1px 7px; }
  .opts span b { color: var(--dim); font-weight: 600; margin-right: 3px; }
  .files { margin-top: 5px; font-size: 12px; color: var(--dim);
           font-family: var(--mono); overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .chip { background: var(--chip); color: var(--dim); border-radius: 999px;
          padding: 1px 8px; font-size: 12px; white-space: nowrap;
          max-width: 100%; overflow: hidden; text-overflow: ellipsis;
          display: inline-flex; align-items: center; gap: 5px; border: 0; }
  .chip.sub-in::before { content: "↩ "; }
  .chip.sub-out::before { content: "↪ "; }
  .chip.sub-in, .chip.sub-out { border: 1px dashed var(--line); background: transparent; }
  .chip.peer { cursor: pointer; color: var(--text); }
  .chip.peer:hover { background: var(--line); }
  .chip .ms { width: 14px; height: 14px; border-radius: 4px; font-size: 10px;
              font-weight: 700; display: grid; place-items: center;
              color: #fff; background: var(--dim); }
  .chip .ms.needs { background: var(--orange); }
  .chip .ms.review { background: var(--green); }
  .chip .ms.running { background: var(--blue); }
  .popwrap { position: relative; height: 0; }
  .pop { position: absolute; left: 0; right: 0; z-index: 5; margin-top: 6px;
         background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
         padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.15); font-size: 12px;
         cursor: default; }
  .pop .m { display: flex; gap: 8px; margin: 3px 0; overflow-wrap: anywhere; }
  .pop .m .d { color: var(--dim); flex: none; width: 56px; }
  .pop .acts { display: flex; gap: 8px; margin-top: 6px; }
  .foot { display: flex; gap: 6px; margin-top: 8px; color: var(--dim);
          font-size: 12px; align-items: center; flex-wrap: wrap; }
  .foot .sp { flex: 1; }
  .foot button, .pop button, .dact button {
    color: var(--text); background: var(--chip); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 9px; cursor: pointer; }
  button.seen:hover { border-color: var(--green); color: var(--green); }
  button.ok { border-color: var(--green) !important; color: var(--green) !important; }
  button.no { border-color: var(--red) !important; color: var(--red) !important; }
  .ans { font-size: 11px; color: var(--muted); }
  .ans.sent { color: var(--green); }
  .ans.refused { color: var(--red); }
  .trunc { font-size: 11px; color: var(--orange, #e0a040); margin: 2px 0 4px; }
  .unread-dot { width: 7px; height: 7px; border-radius: 50%;
                background: var(--green); flex: none; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 8px 14px;
           border-radius: 8px; display: none; gap: 12px; align-items: center;
           font-size: 13px; z-index: 10; max-width: 80vw; }
  .toast.on { display: inline-flex; }
  .toast button { background: none; border: 0; color: inherit;
                  text-decoration: underline; cursor: pointer; padding: 0; }

  /* ---- drawer ---- */
  #drawer h3 { margin: 0; font-size: 15px; font-weight: 600; display: flex;
               align-items: center; gap: 8px; }
  #drawer .close { margin-left: auto; background: none; border: 0; color: var(--dim);
                   font-size: 18px; cursor: pointer; }
  #drawer .dmeta { color: var(--dim); font-size: 12px; margin-top: 4px;
                   display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #drawer .dact { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  #drawer section { margin-top: 12px; }
  #drawer section > h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase;
                         letter-spacing: .06em; color: var(--dim); cursor: pointer;
                         user-select: none; }
  #drawer section.closed > h4::after { content: " ▸"; }
  #drawer section.closed > *:not(h4) { display: none; }
  #drawer .noteedit { width: 100%; font: inherit; font-size: 13px; padding: 5px 8px;
                      border: 1px solid var(--line); border-radius: 6px;
                      background: var(--bg); color: var(--text); }
  #drawer ul.todos { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  #drawer ul.todos li { padding: 2px 0; display: flex; gap: 6px; }
  #drawer ul.todos li .mk { flex: none; width: 14px; color: var(--dim); }
  #drawer ul.todos li.completed { color: var(--dim); text-decoration: line-through; }
  #drawer ul.todos li.in_progress .mk { color: var(--blue); }
  #drawer .ex { margin: 6px 0; font-size: 13px; overflow-wrap: anywhere; }
  #drawer .ex .who { color: var(--dim); font-weight: 600; margin-right: 4px; }
  #drawer .ex .when { color: var(--dim); font-size: 11px; margin-left: 4px; }
  #drawer .full { font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere;
                  max-height: 40vh; overflow: auto; }
  #drawer .peerline { font-size: 12px; margin: 3px 0; overflow-wrap: anywhere; }
  #drawer .peerline .d { color: var(--dim); margin-right: 6px; }
  #drawer .kbd { color: var(--dim); font-size: 11px; margin-top: 16px; }
  #drawer kbd { font-family: var(--mono); background: var(--chip);
                border-radius: 4px; padding: 0 5px; }
</style>
</head>
<body>
<header>
  <h1 id="h">Claude fleet</h1>
  <span class="sum" id="sum"></span>
</header>
<div id="offline">Bridge offline: reconnecting. Showing the last known state.</div>
<div class="bar" id="bar"></div>
<main id="main"></main>
<aside id="drawer"></aside>
<div class="toast" id="toast"><span id="toastmsg"></span><button id="undo">Undo (z)</button></div>

<script>
"use strict";
// Lane order and labels; done/parked start collapsed (remembered per tab).
const LANES = [
  ["needs", "Needs you"], ["limited", "Rate-limited"],
  ["review", "Ready for review"], ["running", "Running"],
  ["done", "Done, seen"], ["parked", "Parked"],
];
const NEED = { permission: "Needs approval", plan: "Plan to approve",
               question: "Asked you a question", error: "Error" };
const SNOOZE_MIN = 30;

// ---- persisted preferences (display only; filters live in the URL) ----
function stored(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
  catch (e) { return fallback; }
}
function store(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
// Done used to start collapsed (it was rarely populated); now that Seen
// fills it, only Parked does. Migrate a tab still holding the old default.
let collapsedPref = stored("csb-collapsed", ["parked"]);
if (JSON.stringify(collapsedPref) === '["done","parked"]') collapsedPref = ["parked"];
const COLLAPSED = new Set(collapsedPref);
const HUES = stored("csb-hues", {});           // project -> palette index
const SHOW = Object.assign({ branch: true, files: true, note: true },
                           stored("csb-show", {}));
const DCLOSED = new Set(stored("csb-drawer-closed", []));

// ---- filters: the URL is the source of truth (?p=a,b&t=x) ----
function readFilters() {
  const q = new URLSearchParams(location.search);
  const split = s => (s || "").split(",").map(x => x.trim()).filter(Boolean);
  return { p: new Set(split(q.get("p"))), t: new Set(split(q.get("t"))) };
}
let F = readFilters();
function writeFilters() {
  const q = new URLSearchParams();
  if (F.p.size) q.set("p", [...F.p].join(","));
  if (F.t.size) q.set("t", [...F.t].join(","));
  const s = q.toString();
  history.replaceState(null, "", location.pathname + (s ? "?" + s : ""));
}
window.addEventListener("popstate", () => { F = readFilters(); render(); });

let doc = null, skew = 0, lastMsg = 0;
const open = new Set();      // narrow-screen expanded cards, by session id
const st = { sel: null, pin: null, local: {}, undo: [], toastTimer: 0,
             pressing: false, deferred: false, lastRender: 0,
             answering: {} };   // sid -> {token, what, ts}: a POSTed answer awaiting its result
// A click needs mousedown and mouseup on the SAME element; a DOM rebuild
// in between swallows it. So no render while a pointer is down.
document.addEventListener("pointerdown", () => { st.pressing = true; }, true);
const released = () => {
  st.pressing = false;
  // pointerup fires BEFORE mouseup/click: rendering here would still
  // replace the button under the click. Let the click land first.
  if (st.deferred) { st.deferred = false; setTimeout(render, 60); }
};
document.addEventListener("pointerup", released, true);
document.addEventListener("pointercancel", released, true);

function ago(ts) {
  if (!ts) return "";
  const s = Math.max(0, Date.now() / 1000 - skew - ts);
  return dur(s) + " ago";
}
function dur(s) {
  s = Math.max(0, Math.floor(s));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h" +
    String(Math.floor(s % 3600 / 60)).padStart(2, "0");
  return Math.floor(s / 86400) + "d";
}
// element helper: text only, never HTML (transcript text is untrusted)
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
// seconds since the doc was built, so timers tick between events
function live() { return Math.max(0, Date.now() / 1000 - skew - doc.ts); }
function nowTs() { return Date.now() / 1000 - skew; }
const letter = c => c.slot == null ? "·" : String.fromCharCode(65 + c.slot);

// ---- cards with local (optimistic) overrides applied ----
function allCards() {
  const out = [];
  for (const [key] of LANES) for (const c of (doc.lanes[key] || [])) {
    const o = st.local[c.sid];
    out.push(o ? Object.assign({}, c, o.patch) : c);
  }
  return out;
}
function tagsOf(c) {
  return [...(c.note || "").matchAll(/#([\w-]+)/g)].map(m => m[1]);
}
function visible(c) {
  if (F.p.size && !F.p.has(c.project)) return false;
  if (F.t.size && !tagsOf(c).some(t => F.t.has(t))) return false;
  return true;
}
const activeNeeds = c => c.lane === "needs" && !c.snooze;

function hueIdx(p) {
  if (HUES[p] != null) return HUES[p];
  let h = 0;
  for (const ch of p) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return h % 8;
}
const hue = p => `var(--p${hueIdx(p) % 8})`;

// ---- filter bar ----
function renderBar(cards) {
  const bar = document.getElementById("bar");
  bar.replaceChildren();
  const projects = [...new Set(cards.map(c => c.project).filter(Boolean))].sort();
  bar.append(el("span", "lbl", "Projects"));
  const all = el("button", "pchip all" + (F.p.size || F.t.size ? "" : " on"), "All");
  all.onclick = () => { F.p.clear(); F.t.clear(); writeFilters(); render(); };
  bar.append(all);
  for (const p of projects) {
    const n = cards.filter(c => c.project === p).length;
    const b = el("button", "pchip" + (F.p.has(p) ? " on" : ""));
    const sw = el("span", "sw"); sw.style.background = hue(p);
    sw.title = "Change colour";
    sw.onclick = (ev) => { ev.stopPropagation(); HUES[p] = (hueIdx(p) + 1) % 8;
                           store("csb-hues", HUES); render(); };
    b.append(sw, document.createTextNode(p), el("span", "n", String(n)));
    b.onclick = (ev) => {
      if (ev.shiftKey) { F.p.has(p) ? F.p.delete(p) : F.p.add(p); }
      else if (F.p.size === 1 && F.p.has(p)) F.p.clear();
      else { F.p.clear(); F.p.add(p); }
      writeFilters(); render();
    };
    bar.append(b);
  }
  const tags = [...new Set(cards.flatMap(tagsOf))].sort();
  for (const t of F.t) if (!tags.includes(t)) tags.push(t);
  if (tags.length) {
    bar.append(el("span", "sep"), el("span", "lbl", "Tags"));
    for (const t of tags) {
      const n = cards.filter(c => tagsOf(c).includes(t)).length;
      const b = el("button", "pchip tag" + (F.t.has(t) ? " on" : ""));
      b.append(document.createTextNode("#" + t), el("span", "n", String(n)));
      b.onclick = () => { F.t.has(t) ? F.t.delete(t) : F.t.add(t); writeFilters(); render(); };
      bar.append(b);
    }
  }
  // the guard: hidden attention never goes silent
  const hiddenNeeds = cards.filter(c => activeNeeds(c) && !visible(c));
  const hiddenReview = cards.filter(c => c.lane === "review" && !visible(c));
  const reveal = list => () => {
    F.t.clear(); list.forEach(c => F.p.add(c.project)); writeFilters(); render();
  };
  if (hiddenNeeds.length) {
    const where = [...new Set(hiddenNeeds.map(c => c.project))].join(", ");
    const g = el("button", "guard", `+${hiddenNeeds.length} need${hiddenNeeds.length === 1 ? "s" : ""} you in ${where}`);
    g.title = "Show them";
    g.onclick = reveal(hiddenNeeds);
    bar.append(g);

// What the card says about an answer for the dialog it shows now (token
// match), or null: "sending…" while our POST awaits the bridge's verdict,
// then the bridge's own result. A new dialog (new token) clears it.

  if (c.lane !== "needs" || !c.answer_token) return null;
  const w = st.answering[c.sid];

    if (w && w.token === r.token) delete st.answering[c.sid];
    return r.ok ? { cls: "sent", text: (r.answer === "approve" ? "accept" : "Escape") + " sent · waiting for the session" }
                : { cls: "refused", text: "not sent: " + r.reason };

  if (w && w.token === c.answer_token) {
    if (Date.now() - w.ts > 10000) { delete st.answering[c.sid]; return { cls: "refused", text: "no answer from the bridge" }; }

  document.getElementById("h").textContent = "Claude fleet · " + doc.host;
  const scope = F.p.size ? [...F.p].join(",") : F.t.size ? "#" + [...F.t].join(",") : "";
  const pre = needs || plus ? `(${needs}${plus ? " +" + plus : ""}) ` : (vis.review || hid.review ? "• " : "");
  document.title = pre + (scope ? scope + " · " : "") + "Claude fleet · " + doc.host;
  const all = doc.counts || {};
  favicon(all.needs ? "#cb6a44" : all.review ? "#2f9e5f" : "#9a978f");
}

let favColor = "";
function favicon(color) {
  if (color === favColor) return;
  favColor = color;
  const c = document.createElement("canvas");
  c.width = c.height = 32;
  const g = c.getContext("2d");
  g.fillStyle = color;
  g.beginPath(); g.arc(16, 16, 12, 0, 7); g.fill();
  document.getElementById("fav").href = c.toDataURL();
}

// ---- actions: POST to the bridge, optimistic until the next doc ----
function post(path, body) {
  // 202 only means "queued for the bridge thread"; anything else is a
  // refusal the user must see, not a silent nothing
  return fetch(path, { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) })
    .then(r => { if (!r.ok) toast(`${path.replace("/api/", "")} rejected (${r.status})`); return r.ok; })
    .catch(() => { toast("bridge unreachable"); return false; });
}
function jump(c) { post("/api/focus", { sid: c.sid }); toast(`Jump: ${letter(c)} ${c.title}`); }
function mark(c, op, extra, patch) {
  post("/api/mark", Object.assign({ sid: c.sid, op }, extra || {}));
  if (patch) st.local[c.sid] = { patch, ts: Date.now() };
  if (op === "snooze") st.local[c.sid] = { patch: { snooze: nowTs() + SNOOZE_MIN * 60 }, ts: Date.now() };
  if (op === "unsnooze") st.local[c.sid] = { patch: { snooze: 0 }, ts: Date.now() };
  render();
}
function markSeen(c) {
  if (!(c.lane === "review" || (c.lane === "parked" && c.unread))) return;
  post("/api/mark", { sid: c.sid, op: "seen", reply_ts: c.reply_ts || undefined });
  st.local[c.sid] = { patch: { lane: "done", unread: false, acked: true,
                               seen_ts: nowTs() }, ts: Date.now() };
  st.undo.push({ sid: c.sid, lane: c.lane });
  // the card must land somewhere visible: open Done if it was collapsed
  if (COLLAPSED.has("done")) { COLLAPSED.delete("done"); store("csb-collapsed", [...COLLAPSED]); }
  toast(`${letter(c)} ${c.title} marked seen`, true);
  render();
}
function undo() {
  const u = st.undo.pop();
  if (!u) return;
  post("/api/mark", { sid: u.sid, op: "unseen" });
  st.local[u.sid] = { patch: { lane: u.lane, unread: true, acked: false }, ts: Date.now() };
  hideToast(); render();
}
function answer(c, what) {
  const w = st.answering[c.sid];
  if (!c.can_answer || !c.answer_token || (w && w.token === c.answer_token)) return;
  st.answering[c.sid] = { token: c.answer_token, what, ts: Date.now() };
  post("/api/answer", { sid: c.sid, answer: what, token: c.answer_token })
    .then(ok => { if (!ok) delete st.answering[c.sid]; render(); });
  toast(`${letter(c)}: ${what === "approve" ? "accept" : "Escape"} queued…`);
  render();
}
// the bridge's verdict for an answer: toast each (session, dialog) once,
// and forget pending answers whose dialog is gone (a session that left
// Needs-you before its result rendered must not block its next dialog)
const toasted = new Set();     // "sid:token" already announced
function answerToasts(d) {
  const needs = d.lanes.needs || [];
  const live = new Set(needs.map(c => c.sid + ":" + c.answer_token));
  for (const sid of Object.keys(st.answering))
    if (!live.has(sid + ":" + st.answering[sid].token)) delete st.answering[sid];
  for (const k of toasted) if (!live.has(k)) toasted.delete(k);
  for (const c of needs) {
    const r = c.answer_result;
    if (!r || r.token !== c.answer_token) continue;
    const key = c.sid + ":" + r.token;
    if (toasted.has(key)) continue;
    toasted.add(key);
    toast(`${letter(c)}: ` + (r.ok ? `${r.answer === "approve" ? "accept" : "Escape"} sent to its terminal`
                                   : `${r.answer} refused — ${r.reason}`));
  }
}
function toast(msg, undoable) {
  const t = document.getElementById("toast");
  document.getElementById("toastmsg").textContent = msg;
  document.getElementById("undo").style.display = undoable ? "" : "none";
  t.classList.add("on");
  clearTimeout(st.toastTimer);
  st.toastTimer = setTimeout(hideToast, 8000);
}
function hideToast() { document.getElementById("toast").classList.remove("on"); }
document.getElementById("undo").onclick = undo;

document.addEventListener("keydown", (ev) => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (!doc) return;
  const cards = allCards();
  const cur = cards.find(c => c.sid === st.sel);
  const k = ev.key;
  if (k === "Escape") { st.sel = null; st.pin = null; render(); return; }
  // actions never use bare letters: those select slots (A.. up to the
  // configured session count), and "e for seen" ate slot E
  if (k === "Backspace") { ev.preventDefault(); undo(); return; }
  if (k === " " && cur) { ev.preventDefault(); markSeen(cur); return; }
  if (k === "-" && cur && cur.lane === "needs") { mark(cur, cur.snooze ? "unsnooze" : "snooze", { minutes: SNOOZE_MIN }); return; }
  if (k === "Enter" && cur && cur.jump) { jump(cur); return; }
  if (k.length === 1 && /[a-zA-Z]/.test(k)) {
    const i = k.toUpperCase().charCodeAt(0) - 65;
    const c = cards.find(x => x.slot === i && visible(x));
    if (c) { st.sel = c.sid; render(); }
  }
});
document.addEventListener("click", () => { if (st.pin) { st.pin = null; render(); } });

function accept(d) {
  doc = d;
  skew = Date.now() / 1000 - d.ts;
  lastMsg = Date.now();
  // an optimistic patch holds until the bridge's document agrees with it
  // (the next step, normally), with a 10 s cap so a refused command can't
  // leave a phantom card behind
  const server = {};
  for (const [key] of LANES) for (const c of (d.lanes[key] || [])) server[c.sid] = c;
  for (const sid of Object.keys(st.local)) {
    const o = st.local[sid], c = server[sid];
    const agreed = !c || Object.keys(o.patch).every(k =>
      k === "seen_ts" ? true : k === "snooze" ? !!c[k] === !!o.patch[k]
      : c[k] === o.patch[k]);
    if (agreed || Date.now() - o.ts > 10000) delete st.local[sid];
  }
  document.body.classList.remove("off");
  answerToasts(d);
  render();
}

const es = new EventSource("/api/events");
es.addEventListener("board", (e) => accept(JSON.parse(e.data)));
fetch("/api/board").then(r => r.json()).then(d => { if (d.lanes) accept(d); })
  .catch(() => {});
// the bridge steps at ~1 Hz: no event for 6s means it is gone
setInterval(() => {
  if (Date.now() - lastMsg > 6000) document.body.classList.add("off");
  // tick timers between events, but not on top of a render the SSE
  // event just did: one rebuild a second is enough churn
  else if (doc && Date.now() - st.lastRender > 700) render();
}, 1000);
</script>
</body>
